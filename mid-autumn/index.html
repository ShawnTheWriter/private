<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中秋·圆满</title>
<style>
html,body{margin:0;height:100%;background:#0a0d1c;overflow:hidden}
body{font-family:"Kaiti SC","STKaiti","KaiTi",serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));box-shadow:0 0 60px rgba(0,0,0,.6)}
#play{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:inherit;font-size:28px;padding:18px 38px;border:3px solid #f3e2bf;border-radius:999px;background:rgba(200,58,38,.94);color:#fff6e2;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#play small{display:block;font-size:13px;opacity:.8;margin-top:4px}
#msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:#f3e2bf;font-size:14px;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:8px;display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="msg"></div>
<button id="play">⏺ 录制视频<small>生成带声音的视频文件 · record video with sound</small></button>
<script>
"use strict";
/* ============================================================
   中秋 · 圆满 —— a 25s vertical greeting film
   WebGL2 + plain JS. All artwork is drawn procedurally at load.
   ============================================================ */
const W = 1080, H = 1920, DUR = 25;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const gl = cv.getContext('webgl2', { antialias: true, alpha: false, premultipliedAlpha: true });
const msg = document.getElementById('msg');
function say(s, ms) { msg.textContent = s; msg.style.display = 'block'; if (ms) setTimeout(() => msg.style.display = 'none', ms); }
if (!gl) { say('此浏览器不支持 WebGL2'); throw new Error('no webgl2'); }

/* ---------------- palette ---------------- */
const INK = '#2b2220', RED = '#d8402b', RED2 = '#a92f1f', GOLD = '#ebb94a', GOLD2 = '#c98f2a',
      JADE = '#3f9a86', TEAL = '#2d7f86', CREAM = '#f6ead0', PINK = '#f4a3a0', SKIN = '#f9dcc2',
      HAIR = '#2a2433', WHITE = '#fbf6ea', BROWN = '#7a5236', LEAF = '#2f6b4f';
const KAI = '"Kaiti SC","STKaiti","KaiTi","Kaiti","BiauKai","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",serif';

/* ---------------- small helpers ---------------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutBack = x => { x = clamp01(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const easeInOut = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const hs = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.lineJoin = 'round'; x.lineCap = 'round'; draw(x, w, h); return c; }
function ell(x, cx, cy, rx, ry, rot = 0) { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); }
function fs(x, fill, stroke = INK, lw = 4) { if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); } }
function rrect(x, a, b, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(a, b, w, h, r) : x.rect(a, b, w, h); }

/* ---------------- GL plumbing ---------------- */
const NOISE = `
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(vs, fsrc) {
  const p = gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fsrc)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const FS_VS = `#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}`;

/* background: night sky, radiating Guochao rings, moon halo */
const BG = program(FS_VS, `#version 300 es
precision highp float;
uniform vec2 uRes; uniform vec3 uMoon; uniform float uGlow,uTime,uPulse;
out vec4 o;
${NOISE}
void main(){
 vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
 float y=p.y/uRes.y;
 vec3 col=mix(vec3(.055,.075,.19),vec3(.13,.15,.33),smoothstep(0.,.6,y));
 col=mix(col,vec3(.27,.2,.38),smoothstep(.55,1.,y));
 float d=length(p-uMoon.xy), e=max(d-uMoon.z,0.);
 float rr=e/64.-uTime*.18-uPulse*.8;
 float band=smoothstep(.45,.55,fract(rr))*(1.-smoothstep(.95,1.,fract(rr)));
 col+=band*exp(-e/560.)*step(uMoon.z,d)*(.03+uPulse*.07)*vec3(1.,.88,.66);
 col+=vec3(1.,.78,.48)*exp(-e/170.)*.26*uGlow;
 col+=vec3(1.,.6,.4)*exp(-e/520.)*.07*uGlow;
 vec2 g=floor(p/5.); float h=hash(g);
 col+=step(.9975,h)*(.25+.25*sin(uTime*3.+h*90.))*vec3(1,.94,.8)*(1.-smoothstep(.55,.75,y));
 col*=1.+(vnoise(p*.8)-.5)*.07+(vnoise(p*vec2(.02,.4))-.5)*.05;
 o=vec4(col,1);
}`);

/* sprite: paper cut-out with torn cream rim, drop shadow, grain, halftone */
const SP = program(`#version 300 es
layout(location=0) in vec2 aPos;
uniform vec2 uRes,uCenter,uSize,uScale; uniform float uRot,uPad;
out vec2 vUV; out vec2 vW;
void main(){
 vec2 q=uSize+2.*uPad; vec2 l=aPos*q; vUV=l/uSize+.5;
 vec2 s=l*uScale; float c=cos(uRot),sn=sin(uRot);
 vec2 w=uCenter+vec2(c*s.x-sn*s.y,sn*s.x+c*s.y); vW=w;
 vec2 cl=w/uRes*2.-1.; cl.y=-cl.y; gl_Position=vec4(cl,0,1);
}`, `#version 300 es
precision highp float;
in vec2 vUV; in vec2 vW;
uniform sampler2D uTex; uniform vec2 uTexel,uShOff;
uniform float uRim,uShadow,uAlpha,uBoil,uSeed;
uniform vec3 uRimCol,uHalfCol; uniform vec4 uTint,uHalf;
out vec4 o;
${NOISE}
bool outside(vec2 uv){return uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.;}
float A(vec2 uv){return outside(uv)?0.:texture(uTex,uv).a;}
void main(){
 vec4 c=outside(vUV)?vec4(0):texture(uTex,vUV);
 c.rgb=mix(c.rgb,uTint.rgb*c.a,uTint.a);
 if(uHalf.x>0.){
  vec2 dir=vec2(cos(uHalf.w),sin(uHalf.w));
  float g=smoothstep(uHalf.y,uHalf.z,dot(vUV-.5,dir));
  vec2 p=mat2(.7071,-.7071,.7071,.7071)*vW/9.;
  float d=length(fract(p)-.5), r=.56*sqrt(g);
  c.rgb=mix(c.rgb,uHalfCol*c.a,(1.-smoothstep(r-.07,r+.07,d))*uHalf.x);
 }
 float n=vnoise(vW*.9+uSeed)*.6+vnoise(vW*vec2(.07,.8)+uSeed*3.)*.4;
 c.rgb*=1.+(n-.5)*.13;
 vec4 oc=c;
 if(uRim>0.){
  float r=uRim*(.5+1.*vnoise(vW*.05+uBoil*7.13+uSeed));
  float dil=c.a;
  for(int i=0;i<12;i++){float an=float(i)*.5236;vec2 d=vec2(cos(an),sin(an))*uTexel;
   dil=max(dil,A(vUV+d*r));dil=max(dil,A(vUV+d*r*.5));}
  float rn=.94+.06*vnoise(vW*1.3);
  oc=c+(1.-c.a)*vec4(uRimCol*rn*dil,dil);
 }
 if(uShadow>0.){
  vec2 us=vUV-uShOff*uTexel;
  float s=outside(us)?0.:texture(uTex,us,3.).a*uShadow;
  oc+=(1.-oc.a)*vec4(vec3(.03,.02,.08)*s,s);
 }
 o=oc*uAlpha;
}`);

/* ribbon: twisted thread */
const RP = program(`#version 300 es
layout(location=0) in vec2 aP; layout(location=1) in vec2 aU;
uniform vec2 uRes,uOff; out vec2 vU; out vec2 vW;
void main(){vec2 w=aP+uOff;vW=w;vU=aU;vec2 cl=w/uRes*2.-1.;cl.y=-cl.y;gl_Position=vec4(cl,0,1);}`,
`#version 300 es
precision highp float;
in vec2 vU; in vec2 vW; uniform vec3 uCol; uniform float uA,uShadow; out vec4 o;
${NOISE}
void main(){
 float e=1.-smoothstep(.55,1.,abs(vU.y));
 if(uShadow>.5){float a=.35*e*uA;o=vec4(vec3(.03,.02,.08)*a,a);return;}
 float tw=.8+.2*sin(vU.x*.9+vU.y*2.4);
 vec3 c=uCol*tw*(1.+(vnoise(vW*.9)-.5)*.12)*(1.-.18*vU.y*vU.y);
 float a=e*uA; o=vec4(c*a,a);
}`);

/* post: grain, vignette, slight print misregistration */
const PP = program(FS_VS, `#version 300 es
precision highp float;
uniform sampler2D uS; uniform vec2 uRes; uniform float uTime,uFade; out vec4 o;
${NOISE}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 vec3 c=vec3(texture(uS,uv+vec2(.0007,.0002)).r,texture(uS,uv).g,texture(uS,uv-vec2(.0007,.0002)).b);
 c+=(hash(gl_FragCoord.xy+floor(uTime*12.)*17.31)-.5)*.045;
 vec2 q=(uv-.5)*vec2(1.25,.95); c*=1.-dot(q,q)*.85;
 c=pow(max(c,0.),vec3(.97,1.,1.03));
 o=vec4(c*uFade,1);
}`);

const quadVAO = gl.createVertexArray(); gl.bindVertexArray(quadVAO);
const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.5, -.5, .5, -.5, -.5, .5, .5, .5]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ribVAO = gl.createVertexArray(); gl.bindVertexArray(ribVAO);
const rb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, rb);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);
const emptyVAO = gl.createVertexArray();
const ribData = new Float32Array(8 * 512);

const fboTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, fboTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

function TX(canvas) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return { t, w: canvas.width, h: canvas.height };
}

/* ---------------- procedural artwork ---------------- */
const S = {};

// --- the moon, torn into paper pieces
const MR = 290, MS = 660, MC = MS / 2;
const moonBase = mk(MS, MS, x => {
  const g = x.createRadialGradient(MC - 40, MC - 50, 20, MC, MC, MR);
  g.addColorStop(0, '#fff7da'); g.addColorStop(.65, '#fbe6a8'); g.addColorStop(1, '#efc574');
  x.fillStyle = g; x.beginPath(); x.arc(MC, MC, MR, 0, 7); x.fill();
  x.save(); x.clip();
  const r = rng(7);
  for (let i = 0; i < 16; i++) { x.fillStyle = `rgba(222,168,90,${.1 + r() * .16})`; x.beginPath(); x.arc(MC + (r() - .5) * 460, MC + (r() - .5) * 460, 18 + r() * 60, 0, 7); x.fill(); }
  x.strokeStyle = 'rgba(255,250,230,.35)'; x.lineWidth = 3;
  for (let k = 1; k < 4; k++) { x.beginPath(); x.arc(MC, MC, MR - k * 16, 0, 7); x.stroke(); }
  x.restore();
});
S.moon = [];
{
  const K = 7, r = rng(11), angs = [];
  for (let i = 0; i < K; i++) angs.push(i / K * Math.PI * 2 - Math.PI / 2 + (r() - .5) * .45);
  const c0 = [MC + (r() - .5) * 50, MC + (r() - .5) * 50];
  const bounds = angs.map(a => { const pts = [c0]; for (let j = 1; j <= 11; j++) { const aa = a + (r() - .5) * .14; pts.push([c0[0] + Math.cos(aa) * j * 36, c0[1] + Math.sin(aa) * j * 36]); } return pts; });
  for (let i = 0; i < K; i++) {
    const a0 = angs[i], a1 = i + 1 < K ? angs[i + 1] : angs[0] + Math.PI * 2;
    const b0 = bounds[i], b1 = bounds[(i + 1) % K];
    const cnv = mk(MS, MS, x => {
      x.beginPath(); b0.forEach((p, j) => j ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
      x.arc(c0[0], c0[1], 430, a0, a1);
      for (let j = b1.length - 1; j >= 0; j--) x.lineTo(b1[j][0], b1[j][1]);
      x.closePath(); x.clip(); x.drawImage(moonBase, 0, 0);
    });
    const mid = (a0 + a1) / 2;
    S.moon.push({ tex: TX(cnv), dx: Math.cos(mid), dy: Math.sin(mid), k: .75 + r() * .5, rot: (r() - .5) * .35, ph: r() * 6 });
  }
}

// --- Guochao layered mountains with contour lines
function hill(w, h, top, fill, line, ridge, step, extra) {
  return mk(w, h, x => {
    const path = new Path2D(); path.moveTo(0, h);
    for (let X = 0; X <= w; X += 4) path.lineTo(X, top(X)); path.lineTo(w, h); path.closePath();
    x.fillStyle = fill; x.fill(path);
    x.save(); x.clip(path);
    if (extra) extra(x, w, h);
    if (step) {
      x.strokeStyle = line; x.lineWidth = 3;
      for (let k = 1; k < 40; k++) { x.beginPath(); for (let X = 0; X <= w; X += 4) { const Y = top(X) + k * step; X ? x.lineTo(X, Y) : x.moveTo(X, Y); } x.stroke(); }
    }
    x.restore();
    x.strokeStyle = ridge; x.lineWidth = 5; x.beginPath();
    for (let X = 0; X <= w; X += 4) X ? x.lineTo(X, top(X) + 2) : x.moveTo(X, top(X) + 2); x.stroke();
  });
}
const peaks = (base, list) => X => base - Math.max(...list.map(([p, h, w]) => h * Math.exp(-Math.pow((X - p) / w, 2))));
S.hillBack = TX(hill(1080, 820, peaks(300, [[40, 170, 120], [250, 110, 110], [520, 190, 120], [790, 130, 110], [1040, 200, 110]]), '#2b4a7d', '#3a5f98', GOLD, 18));
S.hillMid = TX(hill(1080, 560, peaks(170, [[-20, 90, 220], [330, 70, 160], [720, 105, 210], [1100, 95, 180]]), '#3b8a7c', '#56a996', '#f2d27a', 20));
S.hillFront = TX(hill(1080, 340, X => 70 + 18 * Math.sin(X / 140) + 10 * Math.sin(X / 57 + 1), '#1c2f5f', '', GOLD, 0, (x, w, h) => {
  const R0 = 34;
  for (let row = 0; row * R0 * .5 < h + R0; row++) {
    const y = row * R0 * .5 + 30, off = (row % 2) * R0;
    for (let X = -R0 * 2 + off; X < w + R0 * 2; X += R0 * 2) {
      x.beginPath(); x.arc(X, y + R0, R0, 0, 7); x.fillStyle = '#1c2f5f'; x.fill();
      for (let k = 0; k < 4; k++) { x.beginPath(); x.arc(X, y + R0, R0 - 3 - k * 8, Math.PI, 2 * Math.PI); x.strokeStyle = k % 2 ? 'rgba(92,196,176,.55)' : 'rgba(246,234,208,.6)'; x.lineWidth = 3; x.stroke(); }
    }
  }
}));

// --- auspicious cloud (祥云)
function cloud(seed) {
  return mk(390, 200, x => {
    const L = [[95, 120, 50], [172, 90, 64], [256, 106, 56], [318, 130, 40]];
    const sil = () => { x.beginPath(); for (const [a, b, r] of L) { x.moveTo(a + r, b); x.arc(a, b, r, 0, 7); } x.moveTo(72, 128); x.roundRect ? x.roundRect(50, 118, 305, 46, 23) : x.rect(50, 118, 305, 46); };
    sil(); x.strokeStyle = GOLD2; x.lineWidth = 12; x.stroke();
    sil(); x.fillStyle = '#f5e4c0'; x.fill();
    x.strokeStyle = '#d9a441'; x.lineWidth = 5;
    for (const [a, b, r] of L) {
      x.beginPath();
      for (let i = 0; i <= 60; i++) { const s = i / 60, an = -Math.PI / 2 + s * Math.PI * 3.3, rr = r * (.7 - .58 * s); const px = a + Math.cos(an) * rr, py = b + 4 + Math.sin(an) * rr; i ? x.lineTo(px, py) : x.moveTo(px, py); }
      x.stroke();
    }
  });
}
S.cloud = TX(cloud(1));

// --- the child (年画娃娃)
S.child = TX(mk(236, 300, x => {
  x.scale(.885, .885);
  for (const [a, b, c, d] of [[60, 70, 36, 116], [200, 70, 224, 116]]) { x.beginPath(); x.moveTo(a, b); x.quadraticCurveTo((a + c) / 2 - 8, (b + d) / 2, c, d); x.strokeStyle = INK; x.lineWidth = 13; x.stroke(); x.strokeStyle = RED; x.lineWidth = 7; x.stroke(); }
  ell(x, 70, 52, 30, 30); fs(x, HAIR); ell(x, 190, 52, 30, 30); fs(x, HAIR);
  ell(x, 76, 74, 17, 8, .3); fs(x, RED, INK, 3); ell(x, 184, 74, 17, 8, -.3); fs(x, RED, INK, 3);
  rrect(x, 106, 280, 20, 34, 6); fs(x, CREAM); rrect(x, 134, 280, 20, 34, 6); fs(x, CREAM);
  ell(x, 113, 318, 17, 9); fs(x, RED); ell(x, 149, 318, 17, 9); fs(x, RED);
  x.beginPath(); x.moveTo(98, 178); x.lineTo(162, 178); x.quadraticCurveTo(190, 230, 208, 298); x.quadraticCurveTo(130, 310, 52, 298); x.quadraticCurveTo(70, 230, 98, 178); x.closePath();
  const robe = new Path2D(); robe.moveTo(98, 178); robe.lineTo(162, 178); robe.quadraticCurveTo(190, 230, 208, 298); robe.quadraticCurveTo(130, 310, 52, 298); robe.quadraticCurveTo(70, 230, 98, 178);
  x.fillStyle = RED; x.fill(robe);
  x.save(); x.clip(robe); x.fillStyle = GOLD; x.fillRect(40, 276, 190, 40); x.fillStyle = RED;
  for (let i = 0; i < 8; i++) { x.beginPath(); x.arc(58 + i * 21, 290, 5, 0, 7); x.fill(); }
  x.restore(); x.strokeStyle = INK; x.lineWidth = 4; x.stroke(robe);
  ell(x, 130, 184, 36, 13); fs(x, GOLD);
  ell(x, 130, 236, 15, 15); fs(x, GOLD, INK, 3); ell(x, 130, 236, 6, 6); fs(x, RED, null);
  // little lantern on a stick
  x.beginPath(); x.moveTo(190, 256); x.lineTo(236, 196); x.strokeStyle = INK; x.lineWidth = 9; x.stroke(); x.strokeStyle = BROWN; x.lineWidth = 5; x.stroke();
  x.beginPath(); x.moveTo(236, 196); x.lineTo(236, 214); x.strokeStyle = INK; x.lineWidth = 2; x.stroke();
  ell(x, 236, 234, 18, 21); fs(x, RED); x.strokeStyle = GOLD; x.lineWidth = 2; ell(x, 236, 234, 8, 21); x.stroke();
  rrect(x, 227, 211, 18, 6, 2); fs(x, GOLD, INK, 2); rrect(x, 227, 252, 18, 6, 2); fs(x, GOLD, INK, 2);
  x.beginPath(); x.moveTo(236, 258); x.lineTo(236, 276); x.strokeStyle = RED; x.lineWidth = 3; x.stroke();
  ell(x, 84, 226, 20, 38, .55); fs(x, RED); ell(x, 70, 258, 13, 13); fs(x, SKIN);
  ell(x, 176, 226, 20, 38, -.55); fs(x, RED); ell(x, 190, 256, 13, 13); fs(x, SKIN);

        const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
        o.type = 'triangle'; o.frequency.value = hz(n); o.detune.value = det; lp.type = 'lowpass'; lp.frequency.value = 1100;
        g.gain.setValueAtTime(0, T); g.gain.linearRampToValueAtTime(e.g, T + Math.min(1.1, (T1 - T) * .4));
        g.gain.setValueAtTime(e.g, Math.max(T + .01, T1 - .9)); g.gain.linearRampToValueAtTime(0, T1 + .6);
        o.connect(lp); lp.connect(g); voice(g, det < 0 ? -.3 : .3, .6); o.start(T); o.stop(T1 + .7);
      }
    } else if (e.v === 'thump') {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(150, T); o.frequency.exponentialRampToValueAtTime(48, T + .25);
      g.gain.setValueAtTime(e.g, T); g.gain.exponentialRampToValueAtTime(.0001, T + .6);
      o.connect(g); voice(g, 0, .3); o.start(T); o.stop(T + .7);
    }
  }
  // gentle fade at the very end
  out.gain.setValueAtTime(1, t0 + 24.2); out.gain.linearRampToValueAtTime(0, t0 + 25.3);
}

/* ---------------- recording ---------------- */
const playBtn = document.getElementById('play');
const params = new URLSearchParams(location.search);
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
let start = 0, recorder = null, state = 'poster';
let AC = null, master = null, recDest = null, bus = null;

function initAudio() {
  if (AC) { AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC = new Ctx();
  master = AC.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 3;
  const vol = AC.createGain(); vol.gain.value = .85; master.connect(vol); vol.connect(AC.destination);
  recDest = AC.createMediaStreamDestination(); vol.connect(recDest);
  AC.resume();
}
function startFilm() {
  let lead = 0;
  if (AC) {
    if (bus) bus.disconnect();
    bus = AC.createGain(); bus.connect(master);
    lead = .15; playScore(AC, bus, AC.currentTime + lead);
    lead += AC.outputLatency || AC.baseLatency || 0;
  }
  start = performance.now() + lead * 1000; state = 'playing';
}
function tick(now) {
  if (fixedT !== null) { frame(fixedT); window.__ready = true; return; }
  let t = state === 'poster' ? 1.6 : Math.max(0, (now - start) / 1000);
  if (state === 'playing' && t >= DUR) {
    t = DUR; state = 'done';
    if (recorder && recorder.state === 'recording') { const r = recorder; setTimeout(() => r.stop(), 350); }
  }
  frame(t);
  requestAnimationFrame(tick);
}
if (fixedT === null && !params.has('audiotest')) playBtn.style.display = 'block';
requestAnimationFrame(tick);
playBtn.onclick = () => {
  if (!window.MediaRecorder || !cv.captureStream) { say('此浏览器不支持录制，请使用 Chrome', 3000); return; }
  initAudio();
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const type = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  const stream = cv.captureStream(30);
  if (recDest) recDest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 14e6, audioBitsPerSecond: 192e3 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: type || 'video/webm' }));
    a.download = `中秋快乐.${ext}`; document.body.appendChild(a); a.click(); a.remove();
    recorder = null; say(`已保存 中秋快乐.${ext}`, 4000);
    state = 'poster'; playBtn.style.display = 'block';
  };
  playBtn.style.display = 'none'; say('录制中……请勿切换标签页', 2500);
  recorder.start(); startFilm();
};

// test hook: ?audiotest renders the soundtrack offline and reports levels
if (params.has('audiotest')) {
  const off = new OfflineAudioContext(2, 44100 * 26, 44100);
  const comp = off.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.connect(off.destination);
  const g = off.createGain(); g.connect(comp); playScore(off, g, 0);
  off.startRendering().then(buf => {
    const d = buf.getChannelData(0), sec = []; let pk = 0, bad = 0;
    for (let s = 0; s < 26; s++) { let sum = 0; for (let i = s * 44100; i < (s + 1) * 44100; i++) { const v = d[i]; if (!isFinite(v)) bad++; sum += v * v; pk = Math.max(pk, Math.abs(v)); } sec.push(+Math.sqrt(sum / 44100).toFixed(3)); }
    window.__audio = { peak: +pk.toFixed(3), bad, rms: sec };
    const wav = (b => { const n = b.length, o = new DataView(new ArrayBuffer(44 + n * 4)), w = (p, s) => [...s].forEach((c, i) => o.setUint8(p + i, c.charCodeAt(0)));
      w(0, 'RIFF'); o.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); o.setUint32(16, 16, true); o.setUint16(20, 1, true); o.setUint16(22, 2, true); o.setUint32(24, 44100, true); o.setUint32(28, 44100 * 4, true); o.setUint16(32, 4, true); o.setUint16(34, 16, true); w(36, 'data'); o.setUint32(40, n * 4, true);
      const L = b.getChannelData(0), R = b.getChannelData(1); for (let i = 0; i < n; i++) { o.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); o.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); } return o.buffer; })(buf);
    window.__wav = new Uint8Array(wav);
  });
}
